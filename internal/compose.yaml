services:
  codemap:
    build: .
    ports:
      - '127.0.0.1:3100:3100'
    environment:
      INTERNAL_ACCESS_TOKEN: ${INTERNAL_ACCESS_TOKEN:?Set INTERNAL_ACCESS_TOKEN in .env}
      INTERNAL_ORIGIN: ${INTERNAL_ORIGIN:-}
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-}
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
